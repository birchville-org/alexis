[package]
name = "alexis"
version = "0.1.0"
description = "Universal philological vocabulary trainer, corpus reader, and dictionary hub"
authors = ["Marco Demarmels"]
edition = "2021"

[lib]
name = "alexis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
vidyut-lipi = "0.2.0"
regex = "1"
